services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: familyhub
      POSTGRES_USER: familyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhub -d familyhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/albinklintman/family-hub:latest
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=familyhub;Username=familyhub;Password=${POSTGRES_PASSWORD}"
      Email__Password: "${EMAIL_PASSWORD}"
    ports:
      - "8080:8080"
    volumes:
      - dataprotection-keys:/keys
    restart: unless-stopped

volumes:
  postgres-data:
  dataprotection-keys:
